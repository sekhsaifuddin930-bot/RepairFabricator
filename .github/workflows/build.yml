name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: Check Flutter Version & Doctor
      run: flutter --version

    - name: Get Dependencies
      run: flutter pub get

    - name: Recreate Android V2 Embedding
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.repair.fabricator --project-name repair_fabricator

    - name: Force MinSdkVersion to 23 via Python
      run: |
        python3 -c '
        path = "android/app/build.gradle"
        with open(path, "r") as f:
            content = f.read()
        # Replace minSdkVersion safely
        new_content = content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
        new_content = new_content.replace("minSdkVersion 21", "minSdkVersion 23")
        if "minSdkVersion 23" not in new_content:
            # If not replaced, inject it inside defaultConfig
            new_content = new_content.replace("defaultConfig {", "defaultConfig {\n        minSdkVersion 23")
        with open(path, "w") as f:
            f.write(new_content)
        print("Successfully forced minSdkVersion to 23")
        '

    - name: Build APK Release
      run: flutter build apk --release --no-pub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
