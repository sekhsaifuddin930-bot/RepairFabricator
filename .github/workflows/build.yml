name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Recreate Android V2 Embedding
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.repair.fabricator --project-name repair_fabricator

      - name: Force MinSdkVersion to 23 correctly via Python
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          
          # Replace inside defaultConfig block safely
          if "minSdkVersion" in content:
              import re
              # Replace any existing minSdkVersion line with 23
              new_content = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 23", content)
          else:
              # Inject inside defaultConfig if missing
              new_content = content.replace("defaultConfig {", "defaultConfig {\n        minSdkVersion 23")
              
          with open(path, "w") as f:
              f.write(new_content)
          print("Successfully updated minSdkVersion to 23 inside defaultConfig")
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepairFabricator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
