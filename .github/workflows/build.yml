name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Recreate Android V2 Embedding
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.repair.fabricator --project-name repair_fabricator

      - name: Update minSdk to 23
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 16/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 19/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' $GRADLE_FILE
            echo "minSdkVersion successfully updated to 23"
          else
            echo "Gradle file not found!"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepairFabricator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
