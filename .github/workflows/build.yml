name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Recreate Android V2 Embedding
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.repair.fabricator --project-name repair_fabricator

      - name: Ensure Correct MainActivity Path
        run: |
          mkdir -p android/app/src/main/java/com/repair/fabricator
          cat << 'EOF' > android/app/src/main/java/com/repair/fabricator/MainActivity.java
          package com.repair.fabricator;

          import io.flutter.embedding.android.FlutterActivity;

          public class MainActivity extends FlutterActivity {
          }
          EOF
          echo "MainActivity successfully created at correct path"

      - name: Create google-services.json
        run: |
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "132552872909",
              "project_id": "repair-fabricator-308a2",
              "storage_bucket": "repair-fabricator-308a2.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:132552872909:android:e980e13a910e3d382eea84",
                  "android_client_info": {
                    "package_name": "com.repair.fabricator"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "132552872909-jvjtoc4dujefmtg69jdbm26nq4hm09fu.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.repair.fabricator",
                      "certificate_hash": "5e8f16062ea3cd2c4a0d547876baa6f384abf1ed"
                    }
                  },
                  {
                    "client_id": "132552872909-fevvetss9jh685vnullqi4kfb3u6oe55.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDzEHksZGyfXSx7_G-MRyXFhCFXZhrPC4"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "132552872909-fevvetss9jh685vnullqi4kfb3u6oe55.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "google-services.json successfully created"

      - name: Write Perfect build.gradle with minSdkVersion 23
        run: |
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }

          android {
              namespace "com.repair.fabricator"
              compileSdkVersion flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.repair.fabricator"
                  minSdkVersion 23
                  targetSdkVersion flutter.targetSdkVersion
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF
          echo "Successfully wrote clean build.gradle"

      - name: Register Google Services Plugin in settings.gradle
        run: |
          python3 -c '
          p = "android/settings.gradle"
          s = open(p).read()
          target = "id \"dev.flutter.flutter-plugin-loader\" version \"1.0.0\""
          replacement = target + "\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false"
          if "com.google.gms.google-services" not in s and target in s:
              s = s.replace(target, replacement, 1)
              open(p, "w").write(s)
              print("Added google-services plugin to settings.gradle")
          else:
              print("settings.gradle checked")
          '

      - name: Print Android SHA-1 and SHA-256
        run: |
          cd android
          ./gradlew signingReport

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepairFabricator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
