name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: Check Flutter Version & Doctor
      run: flutter --version

    - name: Get Dependencies
      run: flutter pub get

    - name: Recreate Android V2 Embedding
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.repair.fabricator --project-name repair_fabricator

    - name: Force MinSdkVersion to 23 (After Recreation)
      run: |
        BUILD_GRADLE="android/app/build.gradle"
        if [ -f "$BUILD_GRADLE" ]; then
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$BUILD_GRADLE"
          sed -i 's/minSdkVersion 21/minSdkVersion 23/g' "$BUILD_GRADLE"
          echo "minSdkVersion successfully forced to 23"
        else
          echo "Error: build.gradle not found!"
          exit 1
        fi

    - name: Build APK Release
      run: flutter build apk --release --no-pub

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
