name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Copy google-services.json explicitly
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "google-services.json already exists in android/app/"
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Copied google-services.json to android/app/"
          else
            echo "Warning: google-services.json not found!"
          fi

      - name: Fix Android Embedding V2
        run: |
          flutter create --org com.repair.fabricator --project-name repair_fabricator --platforms=android .

      - name: Ensure google-services.json remains in android/app after create
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Update minSdk to 23
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 16/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 19/minSdkVersion 23/g' $GRADLE_FILE
          fi

      - name: Clean project cache
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepairFabricator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
