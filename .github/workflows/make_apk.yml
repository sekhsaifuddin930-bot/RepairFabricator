name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Restore Android configuration and google-services.json
        run: |
          # Ensure google-services.json is intact and prevent any overwriting
          if [ -f "android/app/google-services.json" ]; then
            echo "google-services.json exists."
          fi

      - name: Update minSdk to 23
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 16/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 19/minSdkVersion 23/g' $GRADLE_FILE
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepairFabricator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
