name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Fix Android Embedding V2
        run: |
          flutter create --org com.repair.fabricator --project-name repair_fabricator --platforms=android .

      - name: Ensure google-services.json is in android/app
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Configure Google Services Plugin in Gradle
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "com.android.application" version/id "com.google.gms.google-services" version "4.4.1" apply false\n    id "com.android.application" version/g' android/settings.gradle
          fi
          
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/g' $GRADLE_FILE
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 16/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdkVersion 19/minSdkVersion 23/g' $GRADLE_FILE
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' $GRADLE_FILE
          fi

      - name: Clean project cache
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepairFabricator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
